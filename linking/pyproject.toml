[build-system]
requires = ["setuptools==80.9.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finterm-linker"
version = "0.1.0"
description = "Original FINTERM English Wikidata candidate-ranking pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
wikidata = ["spacy==3.8.18"]

[project.scripts]
finterm-link = "finterm_linking.cli:main"

[tool.setuptools]
packages = ["finterm_linking"]
include-package-data = true

[tool.setuptools.package-data]
finterm_linking = ["_vendor/SHA256_MANIFEST.json", "_vendor/terminlink_en/*.py", "_vendor/terminlink_en/*.csv", "_vendor/terminlink_en/requirements.txt", "_vendor/terminlink_en/docs/*.md"]
