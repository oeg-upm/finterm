# Offline/lazy defaults. Nothing is loaded until load() or generate() is called.
# Revisions should be pinned to approved commits when provisioning the H100.
[qwen3]
model_id = "Qwen/Qwen3-14B"
[qwen3.load]
revision = "main"
device_map = "cuda"
dtype = "bfloat16"
attn_implementation = "eager"
local_files_only = true
context_limit = 32768
[qwen3.generation]
max_new_tokens = 512
do_sample = false
num_beams = 1

[gemma2]
model_id = "google/gemma-2-9b-it"
[gemma2.load]
revision = "main"
device_map = "cuda"
dtype = "bfloat16"
attn_implementation = "eager"
local_files_only = true
context_limit = 8192
[gemma2.generation]
max_new_tokens = 512
do_sample = false
num_beams = 1

[dister]
